# xtsci-optimize -- Doxygen HTML via doxyYoda
# Fetch the theme first: scripts/get_doxyyoda.sh

@INCLUDE                = "./Doxyfile.cfg"

GENERATE_XML            = NO
GENERATE_HTML           = YES
USE_MATHJAX             = YES
MATHJAX_VERSION         = MathJax_3

OUTPUT_DIRECTORY        = "../doxygen-html"
HTML_OUTPUT             = html

HTML_HEADER             = "../doxyYoda/html/header.html"
HTML_FOOTER             = "../doxyYoda/html/footer.html"
HTML_EXTRA_STYLESHEET   = "../doxyYoda/css/doxyYoda.min.css"
LAYOUT_FILE             = "../doxyYoda/xml/doxyYoda.xml"

GENERATE_TREEVIEW       = YES
FULL_SIDEBAR            = NO
HTML_DYNAMIC_SECTIONS   = YES
HTML_CODE_FOLDING       = YES
HAVE_DOT                = NO

# Local Variables:
# mode: conf
# End:
