# xtsci-optimize -- Doxygen base (C/C++ hourglass)

PROJECT_NAME           = "xtsci-optimize"
PROJECT_NUMBER         = "0.1.0"
PROJECT_BRIEF          = "Local first-order minimization over eindir objectives"

OUTPUT_DIRECTORY       = "../doxygen-html"
CREATE_SUBDIRS         = NO

INPUT                  = "../../include" \
                         "./mainpage.dox"
RECURSIVE              = YES
FILE_PATTERNS          = *.h *.hpp *.dox
EXCLUDE_PATTERNS       =

GENERATE_HTML          = YES
GENERATE_LATEX         = NO
GENERATE_XML           = NO
GENERATE_TREEVIEW      = YES
HTML_OUTPUT            = html

EXTRACT_ALL            = YES
EXTRACT_STATIC         = YES
JAVADOC_AUTOBRIEF      = YES
JAVADOC_BANNER         = YES
OPTIMIZE_OUTPUT_FOR_C  = YES
BUILTIN_STL_SUPPORT    = YES
MARKDOWN_SUPPORT       = YES
AUTOLINK_SUPPORT       = YES
SOURCE_BROWSER         = YES
INLINE_SOURCES         = YES
STRIP_CODE_COMMENTS    = NO

WARN_IF_UNDOCUMENTED   = YES
WARN_IF_DOC_ERROR      = YES
QUIET                  = YES
WARNINGS               = YES

HAVE_DOT               = NO

# Local Variables:
# mode: conf
# End:
