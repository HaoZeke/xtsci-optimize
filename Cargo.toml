[package]
name = "xtsci-optimize"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Local first-order minimization over eindir differentiable objectives."
repository = "https://github.com/HaoZeke/xtsci-optimize"
readme = "README.md"
keywords = ["optimization", "conjugate-gradient", "linesearch"]
categories = ["science", "mathematics"]
authors = ["Rohit Goswami <rgoswami@ieee.org>"]

[lib]
name = "xtsci_optimize"
path = "src/lib.rs"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
capi = []
highs = ["dep:highs", "dep:highs-sys"]

[dependencies]
eindir-core = { version = "0.6.0", git = "https://github.com/HaoZeke/eindir.git", rev = "f3c42130bb389ba6cd6e4cfdc8b2e182f4a764e9", features = ["capi"] }
dlpk = { version = "0.1.5", features = ["ndarray"] }
ndarray = "0.17"
thiserror = "2"
rand = "0.9"
highs = { version = "2.1", optional = true }
highs-sys = { version = "1.12", optional = true }

[dev-dependencies]
approx = "0.5"
rgpot-core = { package = "rgpot-core", git = "https://github.com/OmniPotentRPC/rgpot.git", rev = "473033de21a26dc25adb73df3b3640eed0dc0074" }

[build-dependencies]
cbindgen = "0.29"

[package.metadata.capi]
min_version = "0.10.17"

[package.metadata.capi.header]
name = "xts.h"
subdirectory = ""
generation = true
enabled = true

[package.metadata.capi.pkg_config]
name = "xtsci-optimize"
filename = "xtsci-optimize"
description = "Local first-order minimization C ABI"

[package.metadata.capi.library]
name = "xtsci_optimize"

[[example]]
name = "compare_highs"
required-features = ["highs"]


[profile.release]
lto = "thin"
codegen-units = 1
